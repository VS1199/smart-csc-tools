<!-- Wallet Card Dynamic -->
<div class="card p-3 shadow-sm">
    <div class="d-flex align-items-center mb-2">
        <span class="fs-4 me-2">👛</span>
        <div>
            <h6 class="mb-0 text-muted">Wallet Balance</h6>
            <small class="text-secondary">वॉलेट राशि</small>
        </div>
    </div>
    <h3 class="fw-bold my-2">₹ {{ "%.2f"|format(wallet_balance if wallet_balance else 0.0) }}</h3>
    <button type="button" class="btn btn-primary btn-sm mt-2" data-bs-toggle="modal" data-bs-target="#topupModal">
        Top Up Wallet
    </button>
</div>

<!-- Top Up Modal (Dashboard file ke last mein paste karein) -->
<div class="modal fade" id="topupModal" tabindex="-1" aria-labelledby="topupModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="topupModalLabel">Top Up Wallet (वॉलेट रिचार्ज)</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form action="{{ url_for('shop.topup_wallet') }}" method="POST">
        <div class="modal-body">
            <label class="form-label fw-bold">Enter Recharge Amount (₹):</label>
            <input type="number" name="amount" min="10" step="10" value="500" class="form-control mb-3" required>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="this.form.amount.value=200">+ ₹200</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="this.form.amount.value=500">+ ₹500</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="this.form.amount.value=1000">+ ₹1000</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="this.form.amount.value=2000">+ ₹2000</button>
            </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Add Balance Now</button>
        </div>
      </form>
    </div>
  </div>
</div>
