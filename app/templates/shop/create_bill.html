{% extends "base.html" %}

{% block content %}
<div class="dashboard-header">
    <h2>Generate Bill / Tax Receipt</h2>
    <p>Create an instant digital receipt for your customer.</p>
</div>

<div class="auth-card auth-card-wide" style="margin: 0 auto;">
    <form method="POST" action="/shop/billing/create">
        <div class="form-row">
            <div class="form-group">
                <label>Select Customer (Optional)</label>
                <select name="customer_id" style="width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <option value="">-- Walk-in / Direct Customer --</option>
                    {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }} ({{ c.phone }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Select Service / Work *</label>
                <input list="services_list" name="service_type" placeholder="Type or select service..." required style="width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px;">
                <datalist id="services_list">
                    {% for s in services %}
                        <option value="{{ s.service_name }}">₹{{ s.default_price }}</option>
                    {% endfor %}
                </datalist>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Amount Charged (₹) *</label>
                <input type="number" step="0.5" name="amount" placeholder="e.g. 150" required>
            </div>
            <div class="form-group">
                <label>Payment Mode</label>
                <select name="payment_mode" style="width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <option value="CASH">Cash</option>
                    <option value="UPI">UPI / QR Code</option>
                    <option value="CARD">Debit / Credit Card</option>
                </select>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select name="payment_status" style="width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <option value="COMPLETED">Paid (Completed)</option>
                    <option value="PENDING">Pending / Due</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Additional Notes / Acknowledgement</label>
            <input type="text" name="notes" placeholder="e.g. Application No, Acknowledgement token">
        </div>

        <button type="submit" class="btn-primary w-100">Create & View Printable Receipt</button>
    </form>
</div>
{% endblock %}
