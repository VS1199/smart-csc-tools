{% extends "base.html" %}

{% block content %}
<div class="container py-4" style="max-width: 720px;">
  <div class="glass-panel p-4" style="background: rgba(18, 24, 43, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 style="color: #fff; font-weight: 700; margin: 0;">Homepage Live Statistics</h4>
        <small style="color: #94a3b8;">Homepage ke 4 metrics ko yahan se customize karein</small>
      </div>
      <a href="/superadmin/dashboard" class="btn btn-sm btn-outline-light" style="border-radius: 9999px;">Back</a>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label" style="color: #06b6d4; font-weight: 600;">Metric 1: Prints Dispatched</label>
        <input type="text" name="stat_prints" value="{{ stats.prints }}" class="form-control" style="background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.15); color: #fff; border-radius: 12px;" required>
      </div>

      <div class="mb-3">
        <label class="form-label" style="color: #818cf8; font-weight: 600;">Metric 2: Active Pragya Kendras</label>
        <input type="text" name="stat_centers" value="{{ stats.centers }}" class="form-control" style="background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.15); color: #fff; border-radius: 12px;" required>
      </div>

      <div class="mb-3">
        <label class="form-label" style="color: #fbbf24; font-weight: 600;">Metric 3: Uptime Cloud Engine</label>
        <input type="text" name="stat_uptime" value="{{ stats.uptime }}" class="form-control" style="background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.15); color: #fff; border-radius: 12px;" required>
      </div>

      <div class="mb-4">
        <label class="form-label" style="color: #34d399; font-weight: 600;">Metric 4: Latency Processing</label>
        <input type="text" name="stat_latency" value="{{ stats.latency }}" class="form-control" style="background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.15); color: #fff; border-radius: 12px;" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2" style="background: linear-gradient(135deg, #6366f1, #06b6d4); border: none; font-weight: 700; border-radius: 9999px;">
        Save Changes & Update Homepage
      </button>
    </form>
  </div>
</div>
{% endblock %}
