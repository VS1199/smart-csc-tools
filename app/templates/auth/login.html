{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <h2>Center & Staff Login</h2>
    <p>Sign in with your Center Code or Username</p>
    <form method="POST" action="/auth/login">
        <div class="form-group">
            <label for="username">Username / Center Code</label>
            <input type="text" id="username" name="username" placeholder="e.g. superadmin or CSC101" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-primary w-100">Sign In</button>
    </form>
    <div class="auth-footer">
        <p>New Pragya Kendra / CSC Center? <a href="/auth/register">Register Here</a></p>
    </div>
</div>
{% endblock %}
